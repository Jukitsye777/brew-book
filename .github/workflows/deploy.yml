name: Deploy BrewBook

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_IMAGE_NAME: ghcr.io/${{ github.repository }}:latest
  NODE_ENV: production

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.APP_IMAGE_NAME }}
          secrets: |
            "dotenv_key=${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-db:
    name: Run Database Migrations
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Allow GitHub Actions IP in DigitalOcean
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          doctl databases firewalls append "${{ secrets.DO_DATABASE_ID }}" --rule "ip_addr:$RUNNER_IP"
          sleep 20

      - name: Create DigitalOcean CA certificate file
        run: |
          mkdir -p certs
          printf '%s\n' "${{ secrets.DO_DB_CERT }}" > certs/do-ca-certificate.crt

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          NODE_EXTRA_CA_CERTS: certs/do-ca-certificate.crt
        run: pnpm db:migrate

      - name: Revoke GitHub Actions IP from DigitalOcean
        if: always()
        run: |
          RULES_JSON=$(doctl databases firewalls list "${{ secrets.DO_DATABASE_ID }}" -o json)
          RULE_UUID=$(echo "$RULES_JSON" | jq -r ".[] | select(.value == \"$RUNNER_IP\") | .uuid")
          if [ -n "$RULE_UUID" ] && [ "$RULE_UUID" != "null" ]; then
            doctl databases firewalls remove "${{ secrets.DO_DATABASE_ID }}" --uuid "$RULE_UUID"
          fi

  deploy:
    name: Deploy to VPS
    needs: migrate-db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare VPS directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p /var/www/brew-book/deploy/systemd

      - name: Upload Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /var/www/brew-book

      - name: Upload systemd units
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/systemd/*
          target: /var/www/brew-book/deploy/systemd

      - name: Pull and restart BrewBook
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd /var/www/brew-book
            docker compose pull
            docker compose up -d --remove-orphans
            sudo install -m 644 /var/www/brew-book/deploy/systemd/*.service /etc/systemd/system/
            sudo install -m 644 /var/www/brew-book/deploy/systemd/*.timer /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now brew-book-push-morning.timer brew-book-push-evening.timer
            sudo systemctl restart brew-book-push-morning.timer brew-book-push-evening.timer
            docker image prune -f
