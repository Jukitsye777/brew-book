name: Send push notifications

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes (for testing — change to morning/evening times for prod)
  workflow_dispatch:        # manual trigger from GitHub UI

env:
  NODE_ENV: production
  
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Allow GitHub Actions IP in DigitalOcean
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          doctl databases firewalls append "${{ secrets.DO_DATABASE_ID }}" --rule "ip_addr:$RUNNER_IP"
          sleep 20

      - name: Create CA certificate file
        run: |
          mkdir -p certs
          printf '%s\n' "${{ secrets.DO_DB_CERT }}" > certs/do-ca-certificate.crt

      - name: Send push notifications
        run: |
          HOUR=$(TZ=Asia/Kolkata date +%H)
          if [ "$HOUR" -lt 12 ]; then
            pnpm push:send-morning
          else
            pnpm push:send-evening
          fi
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          NODE_EXTRA_CA_CERTS: certs/do-ca-certificate.crt
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}

      - name: Revoke GitHub Actions IP from DigitalOcean
        if: always()
        run: |
          RULES_JSON=$(doctl databases firewalls list "${{ secrets.DO_DATABASE_ID }}" -o json)
          RULE_UUID=$(echo "$RULES_JSON" | jq -r ".[] | select(.value == \"$RUNNER_IP\") | .uuid")
          if [ -n "$RULE_UUID" ] && [ "$RULE_UUID" != "null" ]; then
            doctl databases firewalls remove "${{ secrets.DO_DATABASE_ID }}" --uuid "$RULE_UUID"
          fi
